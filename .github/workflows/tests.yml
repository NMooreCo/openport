# OpenPort's offline test suite on Linux, the OS the hosted dashboard runs on. No API keys: every test fakes
# Token Factory and Tavily. Actions are pinned to commits of releases at least a week old, the same supply-chain
# guard `openport upgrade` applies to dependencies.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.18"
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Install OpenPort
        run: uv sync --frozen
      - name: Install the TypeScript demo app (its calls run in the Node tests)
        working-directory: examples/supportdesk-ts
        run: npm ci --no-audit --no-fund
      - name: Build the dashboard (the server tests serve it)
        working-directory: dashboard
        run: npm ci --no-audit --no-fund && npm run build
      - name: Tests
        run: uv run --no-sync pytest -q
