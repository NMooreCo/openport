[project]
name = "openport"
version = "0.1.0"
description = "Move your app from closed LLM APIs onto NVIDIA Nemotron on Nebius Token Factory, and prove it still works."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.2.0",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "openai>=3.37.0",
    "packaging>=24.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tavily-python>=0.8.5",
    "tree-sitter>=0.26.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
openport = "openport.cli:main"
openport-job = "openport.jobs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openport"]
# The built dashboard is gitignored, but a wheel built after `npm run build` should ship it.
artifacts = ["src/openport/server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
